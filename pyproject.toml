[project]
name = "automation-students-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra",
    "--alluredir=allure-results",
    "--clean-alluredir",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--showlocals",
]

markers = [
    "smoke: быстрые критические проверки",
    "api: API-тесты",
]
